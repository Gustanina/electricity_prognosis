<body>
    <div class="container">
        <h1>My New App</h1>
        <div class="col-md-6">

    </div>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

  new Chart(ctx, {
    type: 'doughnut',
    data: {

      datasets: [
        {
        label: '# of People voted',

        backgroundColor: [
      'rgba(255, 99, 132, 0.2)',

      'rgba(54, 162, 235, 0.2)',
      'rgba(153, 102, 255, 0.2)',
      'rgba(201, 203, 207, 0.2)'
    ],
    borderColor: [
      'rgb(255, 99, 132)',
      'rgb(255, 159, 64)',
      'rgb(255, 205, 86)',
      'rgb(75, 192, 192)',
      'rgb(54, 162, 235)',
      'rgb(153, 102, 255)',

      }

      {
        label: '# of People not voted',
        data: [1, 5, 3, 5, 2, 3],

        backgroundColor: [
      'rgba(255, 99, 132, 0.6)',

      'rgb(255, 99, 132)',

      'rgb(255, 205, 86)',
      'rgb(75, 192, 192)',
      'rgb(54, 162, 235)',
      'rgb(153, 102, 255)',
      'rgb(201, 203, 207)'
    ],
      } */
    ]
      
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
